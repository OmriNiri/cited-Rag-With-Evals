# Runs on every push and pull request: static checks + unit tests, integration
# tests against a real Postgres, and the retrieval-quality gate (D33).
# The LLM answer eval is NOT run here: it needs a local model (run it by hand).
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node major as local development (single source of truth: .nvmrc).
          node-version-file: .nvmrc
          # Caches the npm download cache between runs for faster installs.
          cache: npm

      # `npm ci`, not `npm install`: installs exactly what package-lock.json
      # says and fails if package.json and the lock file disagree.
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # Scripts are not part of the Nest build, so they are type-checked separately.
      - run: npm run typecheck:scripts
      - run: npm test

  # Separate job: needs a real database, runs in parallel with `check`.
  integration:
    runs-on: ubuntu-24.04
    services:
      # Same pinned image as docker-compose.yml, so CI tests what developers run.
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        # GitHub waits for this health check before starting the steps.
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Downloads MiniLM (~90 MB) from Hugging Face on each run, then tests
      # ingestion end to end against the Postgres service above.
      - run: npm run test:int

  # Separate job: re-measures retrieval on the real corpus and the 40-question
  # eval set, and fails if the retriever /ask uses got worse (DECISIONS D33).
  # Catches regressions from changes to chunking, embeddings, SQL, the corpus
  # or the eval set. No LLM needed.
  retrieval-gate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fresh database each run: chunk + embed the committed corpus.
      - run: npm run ingest
      # Overwrites eval/results/retrieval.* and threshold.* in the CI workspace.
      - run: npm run eval:retrieval
      # Shows whether CI measured exactly what is committed (informational:
      # Linux vs macOS floating point may differ slightly; the gate has slack).
      - run: git diff --stat --exit-code eval/results/ || echo "Results differ from the committed ones (see the artifact)."
      - run: npm run eval:gate

      # Keep the measured results, also (especially) when the gate failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retrieval-results
          path: eval/results/
